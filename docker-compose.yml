version: "3.9"

services:
  backend:
    build: ./backend
    environment:
      EDIP_DATA_DIR: /data
      EDIP_DATABASE_URL: postgresql+psycopg2://edip:edip@postgres:5432/edip
      EDIP_VECTOR_BACKEND: ${EDIP_VECTOR_BACKEND:-memory}
      EDIP_PGVECTOR_URL: postgresql+psycopg2://edip:edip@postgres:5432/edip
      EDIP_REDIS_URL: redis://redis:6379/0
      EDIP_USE_CELERY: ${EDIP_USE_CELERY:-false}
      # AI reasoning provider; for host Ollama use base_url http://host.docker.internal:11434
      EDIP_LLM_PROVIDER: ${EDIP_LLM_PROVIDER:-ollama}
      EDIP_LLM_MODEL: ${EDIP_LLM_MODEL:-}
      EDIP_LLM_API_KEY: ${EDIP_LLM_API_KEY:-}
      EDIP_LLM_BASE_URL: ${EDIP_LLM_BASE_URL:-http://host.docker.internal:11434}
      EDIP_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    volumes:
      - edip-data:/data
    ports:
      - "8000:8000"
    depends_on: [postgres, redis]

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      EDIP_DATA_DIR: /data
      EDIP_REDIS_URL: redis://redis:6379/0
      EDIP_USE_CELERY: "true"
    volumes:
      - edip-data:/data
    depends_on: [redis]
    profiles: ["workers"]   # enable with: docker compose --profile workers up

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on: [backend]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edip
      POSTGRES_PASSWORD: edip
      POSTGRES_DB: edip
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  edip-data:
  pg-data:
